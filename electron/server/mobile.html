<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>TCG Tournament</title>
<style>
:root{--bg:#f8fafc;--card:#fff;--fg:#1e293b;--fg2:#64748b;--fg3:#475569;--fg-muted:#94a3b8;--bd:#e2e8f0;--bd-subtle:#f1f5f9;--accent:#1e40af;--success-bg:#dcfce7;--success-fg:#166534;--info-bg:#dbeafe;--my-match-bg:#eff6ff;--input-bg:#fff}
@media(prefers-color-scheme:dark){:root{--bg:#0f172a;--card:#1e293b;--fg:#f1f5f9;--fg2:#94a3b8;--fg3:#cbd5e1;--fg-muted:#64748b;--bd:#334155;--bd-subtle:#1e293b;--accent:#3b82f6;--success-bg:#14532d;--success-fg:#86efac;--info-bg:#1e3a5f;--my-match-bg:#1e3a5f;--input-bg:#1e293b}}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,system-ui,sans-serif;background:var(--bg);color:var(--fg);min-height:100vh}
.header{background:var(--accent);color:#fff;padding:12px 16px;font-size:18px;font-weight:700;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
.header button{background:none;border:1px solid rgba(255,255,255,.4);color:#fff;padding:4px 10px;border-radius:6px;font-size:12px;cursor:pointer}
.container{padding:12px}
.badge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:600}
.badge-active{background:var(--success-bg);color:var(--success-fg)}
.badge-reg{background:var(--info-bg);color:var(--accent)}
.tabs{display:flex;gap:2px;border-bottom:2px solid var(--bd);margin-bottom:12px;overflow-x:auto}
.tab{padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;white-space:nowrap;color:var(--fg2)}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.match{padding:10px;background:var(--card);border-radius:8px;margin-bottom:8px;border:1px solid var(--bd)}
.match-header{display:flex;align-items:center;justify-content:space-between}
.match .table-num{font-size:20px;font-weight:800;color:var(--accent);min-width:50px;text-align:center}
.match .names{flex:1;font-size:14px;font-weight:500}
.match .score{font-size:13px;color:var(--fg2);font-weight:600;margin:0 6px}
input[type=text],input[type=date],textarea,select{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;font-size:14px;margin-bottom:8px;background:var(--input-bg);color:var(--fg)}
textarea{min-height:120px;font-family:monospace;font-size:13px}
button.primary{width:100%;padding:12px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer}
button.primary:disabled{opacity:.5}
button.primary:active{opacity:.8}
button.secondary{width:100%;padding:10px;background:var(--card);color:var(--accent);border:1px solid var(--accent);border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;margin-top:8px}
button.judge{width:100%;padding:14px;background:#dc2626;color:#fff;border:none;border-radius:8px;font-size:16px;font-weight:700;cursor:pointer;margin-top:12px}
button.judge:active{opacity:.8}
button.judge:disabled{opacity:.5}
.standings-table{width:100%;font-size:12px;border-collapse:collapse}
.standings-table th{text-align:left;padding:6px 8px;background:var(--bd-subtle);font-weight:600;color:var(--fg2)}
.standings-table td{padding:6px 8px;border-bottom:1px solid var(--bd-subtle)}
.timer-bar{background:#0f172a;color:#fff;text-align:center;padding:8px;font-family:monospace;font-size:20px;font-weight:700}
.timer-bar.warn{background:#d97706}
.timer-bar.danger{background:#dc2626}
.timer-bar.expired{background:#dc2626;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.6}}
.msg{text-align:center;padding:8px;font-size:13px;color:#16a34a;font-weight:500}
.filter input{width:100%;padding:8px 12px;border:1px solid var(--bd);border-radius:8px;font-size:14px;margin-bottom:10px;background:var(--input-bg);color:var(--fg)}
.reg-done{background:var(--success-bg);border:1px solid var(--success-fg);border-radius:10px;padding:14px;margin-bottom:12px}
.reg-done .name{font-size:16px;font-weight:700;color:var(--success-fg);text-align:center}
.reg-done .details{font-size:12px;color:var(--fg2);margin-top:6px}
.reg-done .details span{display:block;margin-top:2px}
.form-label{display:block;font-size:13px;font-weight:600;color:var(--fg3);margin-bottom:4px}
.form-row{display:flex;gap:8px}
.form-row>*{flex:1}
.form-group{margin-bottom:4px}
.optional{font-weight:400;color:var(--fg-muted);font-size:11px}
.my-match{border:2px solid var(--accent);background:var(--my-match-bg)}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:13px;font-weight:600;z-index:100;box-shadow:0 4px 12px rgba(0,0,0,.3);max-width:90%}
</style>
</head>
<body>
<div id="timer-root"></div>
<div id="app"></div>
<script>
const T={
  en:{pairings:'Pairings',standings:'Standings',register:'Register',
    table:'T',bye:'Bye',vs:'vs',round:'Round',pending:'Pending',draw:'Draw',
    games:'Games',noData:'Loading...',
    rank:'#',player:'Player',points:'Pts',w:'W',l:'L',d:'D',omw:'OMW%',
    registeredAs:'Registered as',decklist:'Decklist',submit:'Submit',
    pasteDecklist:'Paste decklist (e.g. 3x Card Name)',
    decklistSaved:'Saved!',decklistError:'Could not save — please register again on this device.',filter:'Filter by name...',
    firstName:'First Name',lastName:'Last Name',
    dateOfBirth:'Date of Birth',playerId:'Player ID',
    optional:'optional',playerCount:'Players',
    callJudge:'Call Judge',judgeCalled:'Judge has been called!',
    reportToTO:'Report results to the Tournament Organizer',
    dropOut:'Drop from tournament',dropConfirm:'Are you sure you want to drop? This cannot be undone.',dropped:'You have dropped from the tournament.',dropError:'Could not drop — please see the tournament organizer.',
    noDecklists:'No decklists available',cards:'cards',
    reportResult:'Report Result',iWon:'I won',opponentWon:'Opponent won',itsDraw:'Draw',
    resultReported:'Result reported — waiting for TO confirmation.',reportError:'Error reporting result.',
    claimed:'This name is already claimed by another device — ask the organizer for your QR code.',
    jMode:'Judge',jCalls:'Calls',jPenalties:'Penalties',jNoCalls:'No judge calls yet',
    jResultError:'Could not save result',jSelectPlayer:'Player',jPenaltyType:'Penalty',jReason:'Reason',
    jIssue:'Issue penalty',jPenaltySaved:'Penalty issued.',jPenaltyError:'Could not issue penalty',
    jDrop:'Drop player',jDropConfirm:'Drop this player? This cannot be undone.',jDropped:'Player dropped.',jDropError:'Could not drop player',
    jDeck:'Show decklist',jNoDeck:'No decklist submitted',jInvalid:'Judge access is invalid or was revoked.',
    jClaim:'Take this call',jHandles:'is handling',jYou:'you',
    jNamePh:'Your name (visible to other judges)',
    jReports:'Player report',jConflict:'Conflict',
    jInfraction:'Infraction',jCustom:'Custom / free text',jRec:'Recommended:',jRepeat:'Repeat offence',jEsc:'escalated to',
    jExtra:'Extra time',jExtraError:'Could not set extra time',
    pt_warning:'Warning',pt_game_loss:'Game Loss',pt_match_loss:'Match Loss',pt_disqualification:'Disqualification',pt_note:'Note'},
  de:{pairings:'Paarungen',standings:'Rangliste',register:'Registrieren',
    table:'T',bye:'Freilos',vs:'vs',round:'Runde',pending:'Ausstehend',draw:'Unentschieden',
    games:'Spiele',noData:'Laden...',
    rank:'#',player:'Spieler',points:'Pkt',w:'S',l:'N',d:'U',omw:'OMW%',
    registeredAs:'Registriert als',decklist:'Deckliste',submit:'Absenden',
    pasteDecklist:'Deckliste (z.B. 3x Kartenname)',
    decklistSaved:'Gespeichert!',decklistError:'Speichern fehlgeschlagen — bitte auf diesem Gerät neu registrieren.',filter:'Nach Name filtern...',
    firstName:'Vorname',lastName:'Nachname',
    dateOfBirth:'Geburtsdatum',playerId:'Spieler-ID',
    optional:'optional',playerCount:'Spieler',
    callJudge:'Judge rufen',judgeCalled:'Judge wurde gerufen!',
    reportToTO:'Ergebnisse beim Turnierleiter melden',
    dropOut:'Vom Turnier abmelden',dropConfirm:'Bist du sicher? Dies kann nicht rückgängig gemacht werden.',dropped:'Du hast das Turnier verlassen.',dropError:'Abmelden fehlgeschlagen — bitte beim Turnierleiter melden.',
    noDecklists:'Keine Decklisten verfügbar',cards:'Karten',
    reportResult:'Ergebnis melden',iWon:'Ich habe gewonnen',opponentWon:'Gegner hat gewonnen',itsDraw:'Unentschieden',
    resultReported:'Ergebnis gemeldet — TO bestätigt noch.',reportError:'Fehler beim Melden.',
    claimed:'Dieser Name ist bereits von einem anderen Gerät beansprucht — QR-Code beim Turnierleiter anfordern.',
    jMode:'Judge',jCalls:'Rufe',jPenalties:'Strafen',jNoCalls:'Noch keine Judge-Rufe',
    jResultError:'Ergebnis konnte nicht gespeichert werden',jSelectPlayer:'Spieler',jPenaltyType:'Strafe',jReason:'Grund',
    jIssue:'Strafe vergeben',jPenaltySaved:'Strafe vergeben.',jPenaltyError:'Strafe konnte nicht vergeben werden',
    jDrop:'Spieler droppen',jDropConfirm:'Diesen Spieler wirklich droppen? Kann nicht rückgängig gemacht werden.',jDropped:'Spieler gedroppt.',jDropError:'Droppen fehlgeschlagen',
    jDeck:'Deckliste anzeigen',jNoDeck:'Keine Deckliste eingereicht',jInvalid:'Judge-Zugang ungültig oder widerrufen.',
    jClaim:'Übernehmen',jHandles:'übernimmt',jYou:'du',
    jNamePh:'Dein Name (für die anderen Judges sichtbar)',
    jReports:'Spieler-Meldung',jConflict:'Widerspruch',
    jInfraction:'Vergehen',jCustom:'Eigenes / Freitext',jRec:'Empfohlen:',jRepeat:'Wiederholung',jEsc:'hochgestuft auf',
    jExtra:'Extra-Zeit',jExtraError:'Extra-Zeit konnte nicht gesetzt werden',
    pt_warning:'Verwarnung',pt_game_loss:'Game Loss',pt_match_loss:'Match Loss',pt_disqualification:'Disqualifikation',pt_note:'Notiz'}
};
let lang=localStorage.getItem('tcg-lang')||'de';
const t=k=>T[lang][k]||k;
let tournament=null,standings=null,timers=null,activeTab='pairings',boundTournamentId=null;
let timerAlerted=false,pendingVibration=false;
let session=JSON.parse(localStorage.getItem('tcg-session')||'null');
let judge=JSON.parse(localStorage.getItem('tcg-judge')||'null');
let judgeCalls=[],lastCallAt=0,callPollTimer=null;
let judgePenalties=[],judgeReports={},jtTouched=false;
let needsFullRender=true;
const app=document.getElementById('app');
const timerRoot=document.getElementById('timer-root');
const API=location.origin;

function authHeaders(){return session&&session.token?{'Authorization':'Bearer '+session.token}:{}}
async function post(url,body){return fetch(API+url,{method:'POST',headers:Object.assign({'Content-Type':'application/json'},authHeaders()),body:JSON.stringify(body)}).then(r=>r.json())}

function connectSSE(){
  const es=new EventSource(API+'/api/events');
  es.onmessage=e=>{try{const d=JSON.parse(e.data);if(d.timers)timers=d.timers;if(d.state){loadFromState(d.state);needsFullRender=true}}catch{}};
}

function loadFromState(state){
  if(!state||!state.tournaments)return;
  if(boundTournamentId&&state.tournaments[boundTournamentId]){
    tournament=state.tournaments[boundTournamentId];
  }else{
    const ids=Object.keys(state.tournaments);
    if(ids.length>0)tournament=state.tournaments[ids[0]];
  }
}

// A TO-issued QR code carries a pre-bound session token in the URL fragment
// (never sent to the server, never in any log). Adopt it as our session; the
// server tells us which player it belongs to.
async function adoptTokenFromHash(){
  const m=location.hash.match(/token=([A-Za-z0-9_-]+)/);
  if(!m)return;
  history.replaceState(null,'',location.pathname+location.search);
  try{
    const r=await fetch(API+'/api/me',{headers:{'Authorization':'Bearer '+m[1]}});
    if(r.ok){
      const d=await r.json();
      session={fullName:d.playerName,firstName:'',lastName:'',dateOfBirth:'',playerId:'',token:m[1]};
      localStorage.setItem('tcg-session',JSON.stringify(session));
      activeTab='register'; // land on the "registered as ..." confirmation
    }
  }catch{}
}

// The judge QR carries the shared judge token in the URL fragment (never sent
// to the server, never logged). Validate it against /api/judge/me: tokens live
// only in the app's memory, so a stored one dies with an app restart or when
// the TO revokes judge access — then fall back to the normal player view.
async function initJudge(){
  const m=location.hash.match(/judge=([A-Za-z0-9_-]+)/);
  if(m){history.replaceState(null,'',location.pathname+location.search);judge={token:m[1]}}
  if(!judge||!judge.token){judge=null;return}
  try{
    const r=await fetch(API+'/api/judge/me',{headers:{'Authorization':'Bearer '+judge.token}});
    if(r.ok){localStorage.setItem('tcg-judge',JSON.stringify(judge));startCallPolling()}
    else{dropJudgeAccess(false)}
  }catch{}
}

function dropJudgeAccess(notify){
  judge=null;judgeCalls=[];judgePenalties=[];judgeReports={};
  localStorage.removeItem('tcg-judge');
  if(callPollTimer){clearInterval(callPollTimer);callPollTimer=null}
  if(notify)alert(t('jInvalid'));
  needsFullRender=true;
}

function judgeHeaders(){return judge&&judge.token?{'Authorization':'Bearer '+judge.token}:{}}
async function jpost(url,body){
  const r=await fetch(API+url,{method:'POST',headers:Object.assign({'Content-Type':'application/json'},judgeHeaders()),body:JSON.stringify(body)});
  if(r.status===401){dropJudgeAccess(true);return null}
  return r.json();
}

function startCallPolling(){
  if(callPollTimer)return;
  pollCalls();
  callPollTimer=setInterval(pollCalls,5000);
}

async function pollCalls(){
  if(!judge)return;
  try{
    const r=await fetch(API+'/api/judge/calls',{headers:judgeHeaders()});
    if(r.status===401){dropJudgeAccess(true);return}
    if(!r.ok)return;
    const d=await r.json();
    const calls=d.calls||[];
    // A call another judge just claimed gets announced as a toast — that is
    // how "Judge X übernimmt Tisch Y" reaches the other judge devices.
    const prevClaims=new Map(judgeCalls.map(c=>[c.id,c.claimedBy]));
    for(const c of calls){
      if(c.claimedBy&&prevClaims.has(c.id)&&!prevClaims.get(c.id)&&c.claimedBy!==(judge.name||'')){
        showToast(c.claimedBy+' '+t('jHandles')+' '+(c.tableNumber?t('table')+c.tableNumber:c.playerName));
      }
    }
    const newest=calls.length?calls[calls.length-1].at:0;
    const changed=JSON.stringify(calls)!==JSON.stringify(judgeCalls);
    judgeCalls=calls;
    if(newest>lastCallAt){if(lastCallAt>0)doVibrate();lastCallAt=newest}
    if(changed)needsFullRender=true;
  }catch{}
  await pollReports();
}

// Pending self-reports from player phones, shown inline in the judge pairings.
// Piggybacks on the 5-s call polling; the server hides a report as soon as the
// match has a stored result.
async function pollReports(){
  if(!judge)return;
  try{
    const r=await fetch(API+'/api/judge/reports',{headers:judgeHeaders()});
    if(!r.ok)return;
    const d=await r.json();
    const map={};
    for(const e of (d.reports||[]))map[e.matchId]=e.reports;
    if(JSON.stringify(map)!==JSON.stringify(judgeReports)){judgeReports=map;needsFullRender=true}
  }catch{}
}

async function loadJudgePenalties(){
  if(!judge)return;
  try{
    const r=await fetch(API+'/api/judge/penalties',{headers:judgeHeaders()});
    if(r.status===401){dropJudgeAccess(true);return}
    if(r.ok){const d=await r.json();judgePenalties=d.penalties||[]}
  }catch{}
}

function showToast(msg){
  const d=document.createElement('div');
  d.className='toast';d.textContent=msg;
  document.body.appendChild(d);
  setTimeout(()=>d.remove(),4000);
}

// The claim carries the judge's display name: all co-judges share one token,
// so the name is the per-device identity, typed once into the calls tab and
// kept locally. (No prompt(): Electron does not implement it.)
async function claimCall(id){
  if(!judge)return;
  if(!judge.name){
    const el=document.getElementById('jn');
    const n=el?.value?.trim();
    if(!n){if(el){el.focus();el.style.borderColor='#dc2626'}return}
    saveJudgeName();
  }
  try{
    const d=await jpost('/api/judge/calls/'+id+'/claim',{judgeName:judge.name});
    if(d&&!d.ok&&d.claimedBy)showToast(d.claimedBy+' '+t('jHandles'));
  }catch{}
  await pollCalls();
  needsFullRender=true;
}

function saveJudgeName(){
  const n=document.getElementById('jn')?.value?.trim();
  if(!n)return;
  judge.name=n;
  localStorage.setItem('tcg-judge',JSON.stringify(judge));
  needsFullRender=true;
}

async function init(){
  await initJudge();
  if(!judge)await adoptTokenFromHash();
  try{
    const d=await fetch(API+'/api/tournament').then(r=>r.json());
    if(d.tournament){tournament=d.tournament;boundTournamentId=d.tournament.id}
    if(d.standings)standings=d.standings;
    if(d.timers)timers=d.timers;
  }catch{}
  connectSSE();
  needsFullRender=true;
  renderLoop();
}

function renderLoop(){
  if(needsFullRender){render();needsFullRender=false}
  updateTimer();
  requestAnimationFrame(renderLoop);
}

function isRegistered(){
  if(!session||!tournament)return false;
  return tournament.players.some(p=>p.name.toLowerCase()===session.fullName.toLowerCase());
}

function render(){
  if(!tournament){app.innerHTML=`<div class="header">TCG Tournament<button onclick="toggleLang()">${lang.toUpperCase()}</button></div><div class="container"><p>${t('noData')}</p></div>`;return}
  if(judge){renderJudgeMode();return}
  const isReg=tournament.status==='registration';
  const registered=isRegistered();
  if(isReg&&!registered&&activeTab!=='register')activeTab='register';
  if(!isReg&&activeTab==='register')activeTab='pairings';
  const showDecklists=tournament.decklistVisibility==='public'&&!isReg;
  const tabs=[{k:'pairings',l:t('pairings'),s:!isReg||registered},{k:'standings',l:t('standings'),s:!isReg||registered},{k:'decklists',l:t('decklist'),s:showDecklists},{k:'register',l:t('register'),s:isReg}];
  app.innerHTML=`<div class="header"><span>${esc(tournament.name)}</span><button onclick="toggleLang()">${lang.toUpperCase()}</button></div>
    <div class="container">
      <div class="tabs">${tabs.filter(x=>x.s).map(x=>`<div class="tab ${activeTab===x.k?'active':''}" onclick="setTab('${x.k}')">${x.l}</div>`).join('')}</div>
      <div id="tc"></div>
    </div>`;
  const tc=document.getElementById('tc');
  if(activeTab==='pairings')renderPairings(tc);
  else if(activeTab==='standings')renderStandings(tc);
  else if(activeTab==='decklists')renderDecklists(tc);
  else if(activeTab==='register')renderRegister(tc);
}

function renderJudgeMode(){
  const recentCalls=judgeCalls.filter(c=>Date.now()-c.at<15*60*1000).length;
  const reportCount=Object.keys(judgeReports).length;
  const tabs=[
    {k:'pairings',l:t('pairings')+(reportCount?' ('+reportCount+')':'')},
    {k:'standings',l:t('standings')},
    {k:'calls',l:t('jCalls')+(recentCalls?' ('+recentCalls+')':'')},
    {k:'penalties',l:t('jPenalties')},
  ];
  if(!tabs.some(x=>x.k===activeTab))activeTab='pairings';
  app.innerHTML=`<div class="header"><span>⚖ ${esc(tournament.name)}</span><button onclick="toggleLang()">${lang.toUpperCase()}</button></div>
    <div class="container">
      <div class="tabs">${tabs.map(x=>`<div class="tab ${activeTab===x.k?'active':''}" onclick="setTab('${x.k}')">${x.l}</div>`).join('')}</div>
      <div id="tc"></div>
    </div>`;
  const tc=document.getElementById('tc');
  if(activeTab==='pairings')renderPairings(tc);
  else if(activeTab==='standings')renderStandings(tc);
  else if(activeTab==='calls')renderJudgeCalls(tc);
  else if(activeTab==='penalties')renderJudgePenalties(tc);
}

function doVibrate(){
  if(document.hidden){pendingVibration=true;return}
  pendingVibration=false;
  if(navigator.vibrate)navigator.vibrate([500,200,500,200,500]);
}
function playMobileAlarm(){
  try{
    const ctx=new AudioContext();
    if(ctx.state==='suspended')ctx.resume().catch(()=>{});
    const now=ctx.currentTime;
    for(let i=0;i<3;i++){const o=ctx.createOscillator();const g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.frequency.value=880;o.type='square';g.gain.value=0.15;o.start(now+i*0.3);o.stop(now+i*0.3+0.2)}
  }catch{}
  doVibrate();
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&pendingVibration)doVibrate()});

function updateTimer(){
  if(!timers||!tournament||tournament.status==='registration'||tournament.status==='completed'){timerRoot.innerHTML='';timerAlerted=false;pendingVibration=false;return}
  const tm=timers[tournament.id];if(!tm){timerRoot.innerHTML='';timerAlerted=false;pendingVibration=false;return}
  let rem=tm.remainingSeconds;
  if(tm.isRunning&&tm.endTimestamp)rem=Math.max(0,Math.ceil((tm.endTimestamp-Date.now())/1000));
  if(rem===0&&!timerAlerted){timerAlerted=true;playMobileAlarm()}
  if(rem>0){timerAlerted=false;pendingVibration=false;}
  const cls=rem<=0?'expired':rem<=60?'danger':rem<=300?'warn':'';
  const str=`${String(Math.floor(rem/60)).padStart(2,'0')}:${String(rem%60).padStart(2,'0')}`;
  if(timerRoot.dataset.last===str)return;
  timerRoot.dataset.last=str;
  timerRoot.innerHTML=`<div class="timer-bar ${cls}">${str}</div>`;
}

function getMyMatch(){
  if(!session||!tournament)return null;
  const round=tournament.rounds[tournament.rounds.length-1];
  if(!round||round.isComplete)return null;
  const me=tournament.players.find(p=>p.name.toLowerCase()===session.fullName.toLowerCase());
  if(!me)return null;
  const match=round.matches.find(m=>!m.isBye&&(m.player1Id===me.id||m.player2Id===me.id));
  return match?{match,playerId:me.id,playerName:me.name}:null;
}

function getMyPlayer(){
  if(!session||!tournament)return null;
  return tournament.players.find(p=>p.name.toLowerCase()===session.fullName.toLowerCase())||null;
}

function renderPairings(el){
  const round=tournament.rounds[tournament.rounds.length-1];
  if(!round){el.innerHTML='<p>—</p>';return}
  el.innerHTML=`<div class="filter"><input type="text" id="pf" placeholder="${t('filter')}" oninput="filterPairings()"></div><div id="ml"></div>
    ${judge?'':`<p style="margin-top:12px;text-align:center;font-size:12px;color:#94a3b8">${t('reportToTO')}</p>`}
    <div id="jc"></div>`;
  filterPairings();
  if(!judge)renderJudgeButton();
}

// Result buttons under a match, judge mode only: entered results are stored
// directly (no TO confirmation) and stay editable until the round completes.
// A pending self-report from a player phone, mirrored under the match so the
// judge on the floor sees what the TO sees as a confirmation banner. Two
// different claimed results = conflict, flagged red.
function reportBanner(m){
  const entries=judgeReports[m.id]||[];
  if(!entries.length||m.result!=='pending')return'';
  const gn=id=>tournament.players.find(p=>p.id===id)?.name||'?';
  const lbl=r=>r==='draw'?t('draw'):gn(r==='player1_win'?m.player1Id:m.player2Id);
  const conflict=new Set(entries.map(e=>e.result)).size>1;
  const rows=entries.map(e=>`${esc(e.reporterName)} → ${esc(lbl(e.result))}`).join('<br>');
  return`<div style="margin-top:8px;font-size:12px;font-weight:600;border-radius:6px;padding:6px 10px;${conflict?'background:#fee2e2;color:#b91c1c':'background:#fef3c7;color:#92400e'}">📣 ${t('jReports')}${conflict?' — ⚠ '+t('jConflict'):''}<br>${rows}</div>`;
}

function judgeMatchButtons(m,round){
  if(!judge||round.isComplete||m.isBye)return'';
  if(tournament.status!=='in_progress'&&tournament.status!=='top_cut')return'';
  const gn=id=>tournament.players.find(p=>p.id===id)?.name||'?';
  const isKo=['top_cut','winners_bracket','losers_bracket','grand_final'].includes(round.phase);
  const btn=(result,label,active)=>`<button class="secondary" style="margin:0;padding:8px 6px;font-size:12px;flex:1${active?';background:var(--accent);color:#fff':''}" onclick="judgeResult('${m.id}','${result}')">${label}</button>`;
  const xbtn=min=>`<button class="secondary" style="margin:0;padding:6px 10px;font-size:12px;width:auto" onclick="judgeExtra('${m.id}',${min})">${min>0?'+'+min:'✕'}</button>`;
  return reportBanner(m)+`<div style="display:flex;gap:6px;margin-top:8px">
    ${btn('player1_win',esc(gn(m.player1Id)),m.result==='player1_win')}
    ${isKo?'':btn('draw',t('draw'),m.result==='draw')}
    ${btn('player2_win',esc(gn(m.player2Id)),m.result==='player2_win')}
  </div>
  <div style="display:flex;gap:6px;margin-top:6px;align-items:center">
    <span style="font-size:11px;color:var(--fg2)">⏱ ${t('jExtra')}</span>
    ${xbtn(1)}${xbtn(3)}${xbtn(5)}${m.extraTimeMinutes?xbtn(-m.extraTimeMinutes):''}
  </div>`;
}

function filterPairings(){
  const round=tournament.rounds[tournament.rounds.length-1];if(!round)return;
  const gn=id=>tournament.players.find(p=>p.id===id)?.name||'?';
  const f=(document.getElementById('pf')?.value||'').toLowerCase();
  const myInfo=getMyMatch();
  const ml=document.getElementById('ml');if(!ml)return;
  ml.innerHTML=round.matches.filter(m=>{
    if(!f)return true;return gn(m.player1Id).toLowerCase().includes(f)||(m.player2Id&&gn(m.player2Id).toLowerCase().includes(f));
  }).map(m=>{
    if(m.isBye)return`<div class="match"><div class="match-header"><span class="table-num">—</span><span class="names">${esc(gn(m.player1Id))}</span><span class="badge badge-reg">${t('bye')}</span></div></div>`;
    const gs=m.player1Games!=null?`<span class="score">${m.player1Games}-${m.player2Games}</span>`:'';
    const ex=m.extraTimeMinutes?`<span class="badge" style="background:#fef3c7;color:#92400e;margin-right:4px">⏱+${m.extraTimeMinutes}'</span>`:'';
    const rb=m.result==='pending'?`<span class="badge badge-reg">${t('pending')}</span>`:m.result==='draw'?`<span class="badge" style="background:#fef3c7;color:#92400e">${t('draw')}</span>`:`<span class="badge badge-active">${esc(gn(m.result==='player1_win'?m.player1Id:m.player2Id))}</span>`;
    const isMyMatch=myInfo&&m.id===myInfo.match.id;
    return`<div class="match${isMyMatch?' my-match':''}"><div class="match-header"><span class="table-num">${t('table')}${m.tableNumber}</span><span class="names">${esc(gn(m.player1Id))} ${gs} ${t('vs')} ${esc(gn(m.player2Id))}</span>${ex}${rb}</div>${judgeMatchButtons(m,round)}</div>`;
  }).join('');
}

async function doReg(){

  if(!fn||!ln){document.getElementById('rm').textContent=lang==='de'?'Vor- und Nachname erforderlich':'First and last name required';return}
  const dob=document.getElementById('rd')?.value||'';
  const pid=document.getElementById('rp')?.value?.trim()||'';
  const fullName=fn+' '+ln;
  const body={playerName:fullName};
  if(pid)body.playerId=pid;
  if(dob)body.dateOfBirth=dob;
  const res=await post('/api/register',body);
  if(res.ok){

// Decklists are no longer part of the shared state; a player's own list comes
// from the token-gated /api/my-decklist. Tokens live only in the app's memory,
// so if ours is missing or stale (session predates tokens, app restarted),
// re-claim the name — allowed while registration is open AND the name is not
// claimed by a live session. Returns 'ok' | 'claimed' | 'fail'; on 'claimed'
// the recovery path is the per-player QR code from the TO.
async function reclaimToken(){
  if(!session)return 'fail';
  try{
    const body={playerName:session.fullName};
    if(session.playerId)body.playerId=session.playerId;
    if(session.dateOfBirth)body.dateOfBirth=session.dateOfBirth;
    const r=await post('/api/register',body);
    if(r.token){session.token=r.token;localStorage.setItem('tcg-session',JSON.stringify(session));return 'ok'}
    if(r.code==='claimed')return 'claimed';
  }catch{}
  return 'fail';
}

async function fetchMyDecklist(){
  const r=await fetch(API+'/api/my-decklist',{headers:authHeaders()});
  return r.ok?r.json():null;
}

async function loadMyDecklist(){
  if(!session)return;
  try{
    let d=session.token?await fetchMyDecklist():null;
    if(!d&&await reclaimToken()==='ok')d=await fetchMyDecklist();
    const dt=document.getElementById('dt');
    if(dt&&!dt.value&&d&&d.decklist)dt.value=d.decklist.map(e=>e.quantity+'x '+e.cardName).join('\n');
  }catch{}
}

async function tryDl(playerId,txt){
  try{const res=await post('/api/players/'+playerId+'/decklist',{decklistText:txt});return!!(res&&res.ok)}catch{return false}

async function doDl(playerId){
  const txt=document.getElementById('dt')?.value;if(!txt)return;
  let ok=await tryDl(playerId,txt);

    else if(rc==='claimed')claimed=true;

  document.getElementById('dm').textContent=ok?t('decklistSaved'):claimed?t('claimed'):t('decklistError');
}

// Penalty catalog + labels, injected at serve time from src/lib/penaltyCatalog.ts
// and the app's i18n files — the single source; nothing to keep in sync here.
// Entry shape: {i:id, c:category, d:defaultPenalty, e:escalates, l:{en,de}}.
const PDATA=/*__PENALTY_CATALOG__*/null||{order:[],categories:{},catalogs:{}};
const PL_LADDER=['warning','game_loss','match_loss','disqualification'];
const PENALTY_MTYPES=['warning','game_loss','match_loss','disqualification','note'];
const PCAT_ORDER=PDATA.order;
const PCAT_LABEL=PDATA.categories;
const PCATALOG=PDATA.catalogs;
function jGameCatalog(){return PCATALOG[(tournament&&tournament.game)||'']||PCATALOG._gen||[]}
function jFindInf(id){for(const g in PCATALOG){const f=PCATALOG[g].find(x=>x.i===id);if(f)return f}return null}
// Penalties are not in the broadcast state (privacy); judges pull them from
// /api/judge/penalties into judgePenalties before suggesting a level.
function jPriorCount(pid,infId){return judgePenalties.filter(p=>p.playerId===pid&&p.infractionId===infId&&p.type!=='note').length}
function jSuggest(inf,prior){
  const base=PL_LADDER.indexOf(inf.d),offense=prior+1;
  if(!inf.e||prior===0||base<0)return{level:inf.d,esc:false,offense};
  const idx=Math.min(base+prior,PL_LADDER.length-1);
  return{level:PL_LADDER[idx],esc:idx>base,offense};
}
function ilabel(inf){return inf.l[lang]||inf.l.en}
function clabel(c){return PCAT_LABEL[c][lang]||PCAT_LABEL[c].en}

function renderJudgePenalties(el){
  const players=[...tournament.players].sort((a,b)=>a.name.localeCompare(b.name));
  const cat=jGameCatalog();
  const groups=PCAT_ORDER.map(c=>{
    const g=cat.filter(x=>x.c===c);if(!g.length)return'';
    return`<optgroup label="${esc(clabel(c))}">`+g.map(x=>`<option value="${x.i}">${esc(ilabel(x))}</option>`).join('')+`</optgroup>`;
  }).join('');
  el.innerHTML=`
    <div class="form-group"><label class="form-label">${t('jSelectPlayer')}</label>
      <select id="jp" onchange="jtTouched=false;updatePenaltySuggest()">${players.map(p=>`<option value="${p.id}">${esc(p.name)}${p.droppedInRound!==null?' ✕':''}</option>`).join('')}</select></div>
    <div class="form-group"><label class="form-label">${t('jInfraction')}</label>
      <select id="ji" onchange="jtTouched=false;updatePenaltySuggest()"><option value="">${t('jCustom')}</option>${groups}</select></div>
    <div id="jesc" class="msg" style="display:none"></div>
    <div class="form-group"><label class="form-label">${t('jPenaltyType')}</label>
      <select id="jt" onchange="jtTouched=true">${PENALTY_MTYPES.map(x=>`<option value="${x}">${t('pt_'+x)}</option>`).join('')}</select></div>
    <div class="form-group"><label class="form-label">${t('jReason')}</label>
      <input type="text" id="jr" placeholder="${t('jReason')}"></div>
    <button class="primary" onclick="judgeIssuePenalty()">${t('jIssue')}</button>
    <div id="pm" class="msg"></div>
    <button class="secondary" onclick="judgeViewDeck()">${t('jDeck')}</button>
    <pre id="jd" style="display:none;margin-top:8px;font-size:12px;white-space:pre-wrap;color:var(--fg3)"></pre>
    <button class="secondary" style="color:#dc2626;border-color:#dc2626" onclick="judgeDrop()">${t('jDrop')}</button>`;
  loadJudgePenalties();
}

// Selecting an infraction (or a different player) pre-fills the recommended
// level and shows how far a repeat offence has escalated it. Prior offences
// are re-fetched so the count is fresh at the moment of choosing; the level
// dropdown is only overwritten while the judge has not touched it manually.
async function updatePenaltySuggest(){
  await loadJudgePenalties();
  const pid=document.getElementById('jp')?.value;
  const infId=document.getElementById('ji')?.value;
  const escEl=document.getElementById('jesc'),jt=document.getElementById('jt');
  const inf=infId?jFindInf(infId):null;
  if(!inf){if(escEl)escEl.style.display='none';return}
  const s=jSuggest(inf,jPriorCount(pid,infId));
  if(jt&&!jtTouched)jt.value=s.level;
  if(escEl){
    escEl.style.display='';
    escEl.textContent=s.esc
      ?t('jRepeat')+' #'+s.offense+' — '+t('jEsc')+' '+t('pt_'+s.level)
      :t('jRec')+' '+t('pt_'+s.level);
    escEl.style.color=s.esc?'#b45309':'var(--fg-muted)';
  }
}

async function judgeIssuePenalty(){
  const pid=document.getElementById('jp')?.value,type=document.getElementById('jt')?.value;
  const infId=document.getElementById('ji')?.value||'';
  const reason=document.getElementById('jr')?.value?.trim()||'';
  const pm=document.getElementById('pm');if(!pid||!type)return;
  const body={type,reason};if(infId)body.infractionId=infId;
  try{
    const d=await jpost('/api/judge/players/'+pid+'/penalty',body);
    if(!pm)return;
    if(d&&d.ok){
      pm.textContent=t('jPenaltySaved');const jr=document.getElementById('jr');if(jr)jr.value='';
      // The penalty reaches the state via the renderer's debounced sync; refresh
      // the escalation hint once it has landed so a repeat shows immediately.
      jtTouched=false;setTimeout(updatePenaltySuggest,1500);
    }
    else if(d)pm.textContent=t('jPenaltyError')+(d.error?': '+d.error:'');
  }catch{if(pm)pm.textContent=t('jPenaltyError')}
}

async function judgeDrop(){
  const pid=document.getElementById('jp')?.value;if(!pid)return;
  if(!confirm(t('jDropConfirm')))return;
  const pm=document.getElementById('pm');
  try{
    const d=await jpost('/api/judge/players/'+pid+'/drop',{});
    if(pm)pm.textContent=d&&d.ok?t('jDropped'):t('jDropError')+(d&&d.error?': '+d.error:'');
  }catch{if(pm)pm.textContent=t('jDropError')}
}

async function judgeViewDeck(){
  const pid=document.getElementById('jp')?.value;const jd=document.getElementById('jd');
  if(!pid||!jd)return;
  if(jd.style.display!=='none'){jd.style.display='none';return}
  try{
    const r=await fetch(API+'/api/judge/players/'+pid+'/decklist',{headers:judgeHeaders()});
    if(r.status===401){dropJudgeAccess(true);return}
    const d=await r.json();
    jd.textContent=d.decklist&&d.decklist.length?(d.deckName?d.deckName+'\n\n':'')+d.decklist.map(e=>e.quantity+'x '+e.cardName).join('\n'):t('jNoDeck');
    jd.style.display='block';
  }catch{}
}

function setTab(k){activeTab=k;needsFullRender=true}
function toggleLang(){lang=lang==='de'?'en':'de';localStorage.setItem('tcg-lang',lang);needsFullRender=true}
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}

init();
</script>
</body>
</html>
