name: Fehler melden
description: Etwas funktioniert nicht wie erwartet
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Sicherheitslücken bitte **nicht** hier melden, sondern gemäß [SECURITY.md](../blob/main/SECURITY.md).
        Entferne personenbezogene Daten aus Anhängen.
  - type: textarea
    id: what
    attributes:
      label: Was ist passiert?
      description: Beschreibe den Fehler und was du stattdessen erwartet hast.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Schritte zum Nachstellen
      placeholder: |
        1. Turnier anlegen …
        2. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App-Version
      placeholder: z. B. 1.7.3
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Betriebssystem
      options: [Windows, macOS, Linux, Mobile-Browser (Spieler-/Judge-Seite)]
    validations:
      required: true
  - type: input
    id: game
    attributes:
      label: Spiel und Turnierformat
      placeholder: z. B. Magic, Swiss + Top Cut
